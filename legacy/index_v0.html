<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>不烧心小馆 · 做饭手感初版</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #203b34; overflow: hidden; }
    body { display: grid; place-items: center; min-height: 100dvh; }
    canvas { display: block; touch-action: none; cursor: pointer; max-width: 100vw; max-height: 100dvh; box-shadow: 0 18px 70px rgba(0,0,0,.38); }
    canvas:focus-visible { outline: 4px solid #efd28c; outline-offset: -4px; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="不烧心小馆做饭手感初版：根据顾客头顶的图案，选择粥锅、豆浆壶或油锅完成早餐。"></canvas>
  <script src="src/gameplay.js"></script>
  <script src="src/app.js"></script>
  <script src="src/web.js"></script>
</body>
</html>
